<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificação - Cake Couture</title>
    <style>
        :root {
            --primary: #92400e;
            --primary-dark: #78350f;
            --bg-main: #fbf8f5;
            --card-bg: #ffffff;
            --text-main: #292524;
            --text-muted: #78716c;
            --border: #e7e2dc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            text-align: center;
        }

        .login-card h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .input-group input {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--bg-main);
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .btn-entrar {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }

        .btn-entrar:hover {
            background-color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>🍰 Cake Couture</h1>
        <p>Informe seus dados para acessar o cardápio e fazer sua encomenda.</p>

        <form onsubmit="salvarClienteEContinuar(event)">
            <div class="input-group">
                <label>Seu Nome Completo</label>
                <input type="text" id="visitanteNome" placeholder="Ex: Mariana Silva" required>
            </div>
            <div class="input-group">
                <label>WhatsApp ou E-mail</label>
                <input type="text" id="visitanteContato" placeholder="Ex: (11) 99999-9999" required>
            </div>
            <button type="submit" class="btn-entrar">Acessar Cardápio ➔</button>
        </form>
    </div>

    <script>
        function salvarClienteEContinuar(event) {
            event.preventDefault();

            const nome = document.getElementById('visitanteNome').value;
            const contato = document.getElementById('visitanteContato').value;

            // Salva os dados do cliente atual no navegador para usar na hora do pedido
            const dadosCliente = {
                id: Date.now(),
                nome,
                contato,
                dataAcesso: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
            };

            localStorage.setItem('clienteAtualCake', JSON.stringify(dadosCliente));

            // Salva também em uma lista geral de leads/contatos para o painel administrativo
            let listaContatos = localStorage.getItem('cakeCoutureContatos');
            listaContatos = listaContatos ? JSON.parse(listaContatos) : [];
            listaContatos.unshift(dadosCliente);
            localStorage.setItem('cakeCoutureContatos', JSON.stringify(listaContatos));

            // Redireciona para o cardápio oficial
            window.location.href = "cardapio.html";
        }
    </script>
</body>
</html>
